<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Центрированная кнопка видео</title>
    <style>
        /* Делаем так, чтобы страница занимала всю высоту экрана */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f5f5f7; /* Цвет фона (можно изменить) */
        }

        /* Центрируем содержимое с помощью Flexbox */
        .center-container {
            display: flex;
            justify-content: center; /* Центрирование по горизонтали */
            align-items: center;     /* Центрирование по вертикали */
            height: 100%;            /* Высота на весь экран */
        }

        /* Стиль кнопки (в стиле интерфейса приложения) */
        .app-video-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #007AFF; /* Фирменный цвет приложения */
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
            transition: all 0.2s ease-in-out;
        }

        .app-video-button:hover {
            background-color: #005ec4;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 122, 255, 0.4);
        }

        .app-video-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }

        /* Иконка Play */
        .app-video-button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Контейнер, который выравнивает кнопку строго по центру экрана -->
    <div class="center-container">
        <a href="https://drive.google.com/file/d/1F5Tg3Ef8HfLd4Jl6QqR7OjcIQv3a14Sz/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="app-video-button">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            смотреть видеоролик
        </a>
    </div>

</body>
</html>
